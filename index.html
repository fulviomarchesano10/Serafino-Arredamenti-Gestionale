<!doctype html>
<html lang="it">
<head>

<style>
:root{--ink:#35404b;--muted:#7d858c;--line:#e7e8e8;--paper:#fff;--bg:#f5f5f3;--sand:#d7c8b2;--sand-light:#f0e9df;--green:#537967;--red:#a95555;--blue:#547b9d;--shadow:0 8px 28px rgba(43,49,54,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:252px;background:#fff;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:5}.brand{padding:5px 13px 25px;border-bottom:1px solid var(--line);margin-bottom:20px}.brand img{display:block;width:100%;max-width:205px;max-height:92px;object-fit:contain}.brand-fallback{font-size:24px;letter-spacing:5px;font-weight:500}.brand small{display:block;color:var(--muted);letter-spacing:3px;font-size:10px;margin-top:5px}.nav-label{font-size:10px;letter-spacing:1.7px;color:#a0a5a8;padding:12px 13px 8px;font-weight:700}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#66717b;padding:12px 13px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:12px;font-size:14px}.nav button:hover{background:#f7f5f1}.nav button.active{background:var(--sand-light);color:var(--ink);font-weight:650}.ico{width:19px;text-align:center;font-size:17px}.sidebar-bottom{margin-top:auto;padding:15px 12px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.sidebar-bottom strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}.main{margin-left:252px;width:calc(100% - 252px);min-width:0}.topbar{height:76px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4;backdrop-filter:blur(12px)}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:650}.top-actions{display:flex;align-items:center;gap:12px}.search{width:230px;border:1px solid var(--line);background:#fafafa;border-radius:9px;padding:10px 12px;font-size:12px;outline:none}.avatar{height:36px;width:36px;border-radius:50%;background:var(--sand-light);display:grid;place-items:center;font-size:12px;font-weight:700}.content{max-width:1500px;margin:0 auto;padding:31px 34px 50px}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2px;color:#9b8b76;font-weight:750;margin-bottom:8px}.page-heading h1{margin:0;font-size:29px;letter-spacing:-.8px;font-weight:650}.page-heading p{margin:9px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid transparent;border-radius:9px;padding:11px 15px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:8px}.btn-primary{background:var(--ink);color:white}.btn-primary:hover{background:#202932}.btn-secondary{background:white;border-color:var(--line);color:var(--ink)}.btn-sand{background:var(--sand-light);color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:19px 20px;box-shadow:var(--shadow)}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{height:32px;width:32px;display:grid;place-items:center;border-radius:9px;background:var(--sand-light);font-size:16px}.stat-value{font-size:27px;font-weight:650;letter-spacing:-.8px;margin:15px 0 7px}.stat-note{font-size:11px;color:var(--muted)}.stat-note .positive{color:var(--green);font-weight:700}.grid-two{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}.panel-head{padding:19px 21px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}.panel-head h2{font-size:14px;margin:0;font-weight:700}.panel-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.text-button{border:0;background:transparent;color:#8c7961;font-size:11px;font-weight:700}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#9ba1a5;font-size:10px;letter-spacing:.8px;font-weight:700;padding:13px 20px;background:#fdfdfc;border-bottom:1px solid var(--line)}td{padding:15px 20px;border-bottom:1px solid #f0f0ef;font-size:12px}tr:last-child td{border-bottom:0}.primary-cell{font-weight:650;color:var(--ink)}.sub-cell{font-size:10px;color:var(--muted);margin-top:4px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:700;background:#f1f2f2;color:#737d83}.pill.green{background:#e8f1ec;color:#4b765e}.pill.orange{background:#f7efe3;color:#9b7743}.pill.blue{background:#eaf0f6;color:#537b9d}.pill.red{background:#f8eaea;color:#a95555}.dot{height:5px;width:5px;border-radius:50%;background:currentColor}.activity-list{padding:4px 21px}.activity{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #f0f0ef}.activity:last-child{border-bottom:0}.activity-icon{width:32px;height:32px;border-radius:9px;background:#f5f2ed;display:grid;place-items:center;flex-shrink:0}.activity strong{font-size:12px;display:block;margin:1px 0 5px}.activity span{font-size:11px;color:var(--muted)}.activity time{margin-left:auto;font-size:10px;color:#a3a8ab;white-space:nowrap}.task-list{padding:7px 21px 13px}.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #f0f0ef}.task:last-child{border:0}.task-mark{width:7px;height:7px;border-radius:50%;background:#c6a77e;flex-shrink:0}.task-text{font-size:12px;font-weight:600;flex:1}.task small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:4px}.task-date{font-size:10px;color:var(--muted)}.section-toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.filter{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink);outline:none}.table-panel{margin-top:0}.empty{padding:36px;text-align:center;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;padding:22px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#69747c}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;color:var(--ink);font-size:12px;outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#b6a58f;box-shadow:0 0 0 3px #f5f0e9}.form-actions{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.notice{background:#f5f0e9;border:1px solid #eadfce;border-radius:10px;padding:14px 16px;color:#75634e;font-size:12px;line-height:1.5;margin-bottom:20px}.hidden{display:none!important}.mobile-menu{display:none}.modal-backdrop{position:fixed;inset:0;background:rgba(35,40,45,.4);z-index:20;display:grid;place-items:center;padding:18px}.modal{background:white;border-radius:14px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0002}.modal-title{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-title h2{margin:0;font-size:17px}.close{border:0;background:#f5f5f3;border-radius:8px;width:31px;height:31px;font-size:18px;color:var(--ink)}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:white;padding:13px 17px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);z-index:30}.footer-note{font-size:10px;color:#a3a8ab;margin-top:8px}.welcome{background:linear-gradient(110deg,#fff 0%,#faf8f5 100%);border:1px solid var(--line);border-radius:14px;padding:21px 23px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.welcome h2{margin:0 0 7px;font-size:17px}.welcome p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}.welcome-mark{font-size:32px;opacity:.65}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-two{grid-template-columns:1fr}.search{width:170px}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:260px;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.topbar{height:64px;padding:0 16px}.mobile-menu{display:inline-flex;border:0;background:transparent;font-size:22px;color:var(--ink);margin-right:12px}.top-left{display:flex;align-items:center}.search{display:none}.content{padding:23px 15px 40px}.page-heading{flex-direction:column;align-items:stretch}.page-heading h1{font-size:25px}.page-heading .btn{justify-content:center}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:23px}.stat-top{font-size:11px}.stat-note{font-size:10px}.panel-head{padding:16px}.panel-head h2{font-size:13px}.welcome{padding:17px}.welcome-mark{display:none}.form-grid{grid-template-columns:1fr;padding:17px}.field.full{grid-column:auto}.top-actions{gap:7px}.crumb{font-size:12px}.avatar{height:32px;width:32px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <img src="assets/logo-serafino.png" alt="SERAFINO — Sogna. Arreda. Vivi." onerror="this.style.display='none';document.getElementById('brandFallback').classList.remove('hidden')">
    <div id="brandFallback" class="hidden"><div class="brand-fallback">SERAFINO</div><small>SOGNA. ARREDA. VIVI.</small></div>
  </div>
  <div class="nav-label">GESTIONE AZIENDALE</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">◫</span>Dashboard</button>
    <button data-page="clienti"><span class="ico">♙</span>Clienti</button>
    <button data-page="prodotti"><span class="ico">▦</span>Prodotti</button>
    <button data-page="preventivi"><span class="ico">▤</span>Preventivi</button>
    <button data-page="ordini"><span class="ico">▣</span>Ordini</button>
    <button data-page="fornitori"><span class="ico">⌂</span>Fornitori</button>
    <button data-page="pagamenti"><span class="ico">€</span>Pagamenti</button>
    <button data-page="consegne"><span class="ico">↗</span>Consegne</button>
    <button data-page="statistiche"><span class="ico">▥</span>Statistiche</button>
  </nav>
  <div class="nav-label">SISTEMA</div>
  <nav class="nav"><button data-page="utenti"><span class="ico">⚙</span>Utenti e impostazioni</button></nav>
  <div class="sidebar-bottom"><strong>Arredamenti Serafino</strong>Gestionale aziendale · Versione prototipo</div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-left"><button class="mobile-menu" id="mobileMenu" aria-label="Apri menu">☰</button><div class="crumb">SERAFINO <span style="color:#c4c7c8"> / </span> <strong id="breadcrumb">Dashboard</strong></div></div>
  <div class="top-actions"><input id="globalSearch" class="search" placeholder="Cerca clienti, ordini…"><div class="avatar" title="Utente dimostrativo">AS</div></div>
</header>
<div class="content" id="content"></div>
</main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const pages = {
 dashboard:{title:'Panoramica',sub:'Tieni sotto controllo le attività di Arredamenti Serafino.',action:'Nuovo cliente'},
 clienti:{title:'Clienti',sub:'Anagrafiche, contatti e relazioni commerciali.',action:'Aggiungi cliente'},
 prodotti:{title:'Catalogo prodotti',sub:'Organizza articoli, categorie, prezzi e fornitori.',action:'Nuovo prodotto'},
 preventivi:{title:'Preventivi',sub:'Prepara offerte commerciali e segui le conferme.',action:'Nuovo preventivo'},
 ordini:{title:'Ordini',sub:'Monitora lo stato degli ordini dei clienti.',action:'Nuovo ordine'},
 fornitori:{title:'Fornitori',sub:'Contatti, marchi e riferimenti dei fornitori.',action:'Nuovo fornitore'},
 pagamenti:{title:'Pagamenti',sub:'Tieni traccia di acconti, saldi e importi residui.',action:'Registra pagamento'},
 consegne:{title:'Consegne e montaggi',sub:'Organizza gli appuntamenti e gli interventi.',action:'Pianifica consegna'},
 statistiche:{title:'Statistiche',sub:'Una panoramica commerciale basata sui dati registrati.',action:''},
 utenti:{title:'Utenti e impostazioni',sub:'Configurazione del gestionale e gestione degli accessi.',action:'Aggiungi utente'}
};
const seed = {
 clienti:[{id:1,nome:'Mario Rossi',telefono:'333 1234567',email:'mario@example.it',indirizzo:'Via Roma 12, Napoli',note:'Esempio dimostrativo'},{id:2,nome:'Giulia Esposito',telefono:'333 9876543',email:'giulia@example.it',indirizzo:'Via Verdi 8, Nola',note:'Esempio dimostrativo'},{id:3,nome:'Antonio Bianchi',telefono:'333 5550123',email:'antonio@example.it',indirizzo:'Via Napoli 20, Sarno',note:'Esempio dimostrativo'}],
 prodotti:[{id:1,nome:'Cucina contemporanea',categoria:'Cucine',marca:'Da definire',prezzo:5900,fornitore:'Da associare',disponibilita:'Su ordinazione'},{id:2,nome:'Divano 3 posti',categoria:'Divani e poltrone',marca:'Da definire',prezzo:1890,fornitore:'Da associare',disponibilita:'Su ordinazione'},{id:3,nome:'Tavolo allungabile',categoria:'Tavoli e sedie',marca:'Da definire',prezzo:790,fornitore:'Da associare',disponibilita:'Da verificare'}],
 preventivi:[{id:1,numero:'PRE-2026-001',cliente:'Mario Rossi',data:'2026-10-10',totale:6690,stato:'In attesa'},{id:2,numero:'PRE-2026-002',cliente:'Giulia Esposito',data:'2026-10-09',totale:2680,stato:'Inviato'}],
 ordini:[{id:1,numero:'ORD-2026-001',cliente:'Mario Rossi',data:'2026-10-08',totale:8500,stato:'In lavorazione',consegna:'Da programmare'},{id:2,numero:'ORD-2026-002',cliente:'Antonio Bianchi',data:'2026-10-06',totale:2680,stato:'In attesa fornitore',consegna:'Da programmare'}],
 fornitori:[{id:1,nome:'Fornitore dimostrativo',referente:'Referente commerciale',telefono:'081 0000000',email:'ordini@example.it',marchi:'Da configurare'}],
 pagamenti:[{id:1,ordine:'ORD-2026-001',cliente:'Mario Rossi',data:'2026-10-08',importo:2500,metodo:'Bonifico',note:'Acconto dimostrativo'}],
 consegne:[{id:1,cliente:'Mario Rossi',ordine:'ORD-2026-001',data:'2026-10-17',ora:'09:00',indirizzo:'Via Roma 12, Napoli',stato:'Da confermare',tipo:'Consegna e montaggio'}],
 utenti:[{id:1,nome:'Amministratore demo',email:'admin@serafino.local',ruolo:'Proprietario',stato:'Demo'}]
};
const storeKey='serafino_gestionale_v1';
let db;
try{db=JSON.parse(localStorage.getItem(storeKey))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}
let current='dashboard';
const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(Number(n)||0);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}
function statusClass(s){s=(s||'').toLowerCase();if(s.includes('conferm')||s.includes('conclus')||s.includes('accett'))return 'green';if(s.includes('ritard')||s.includes('scadut'))return 'red';if(s.includes('inviat')||s.includes('lavoraz'))return 'blue';if(s.includes('attesa')||s.includes('programm'))return 'orange';return ''}
function pill(s){return `<span class="pill ${statusClass(s)}"><span class="dot"></span>${escapeHtml(s||'Da definire')}</span>`}
function heading(title,sub,action=''){return `<div class="page-heading"><div><div class="eyebrow">SERAFINO · GESTIONALE</div><h1>${title}</h1><p>${sub}</p></div>${action?`<button class="btn btn-primary" onclick="newRecord('${current}')">＋ ${action}</button>`:''}</div>`}
function panel(title,subtitle,body,action=''){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action?`<button class="text-button" onclick="${action}">Vedi tutto →</button>`:''}</div>${body}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function rowPrimary(name,sub=''){return `<div class="primary-cell">${escapeHtml(name)}</div>${sub?`<div class="sub-cell">${escapeHtml(sub)}</div>`:''}`}
function dashboard(){
 const residuo=db.ordini.reduce((sum,o)=>sum+Number(o.totale||0),0)-db.pagamenti.reduce((sum,p)=>sum+Number(p.importo||0),0);
 const rows=db.ordini.slice(0,5).map(o=>`<tr><td>${rowPrimary(o.numero,o.cliente)}</td><td>${escapeHtml(o.data||'—')}</td><td>${euro(o.totale)}</td><td>${pill(o.stato)}</td></tr>`).join('');
 const tasks=[...db.preventivi.filter(p=>p.stato!=='Accettato').slice(0,2).map(p=>({title:`Ricontattare ${p.cliente}`,sub:`Preventivo ${p.numero}`,date:p.data})),...db.consegne.filter(c=>c.stato!=='Completata').slice(0,2).map(c=>({title:`Verificare consegna · ${c.cliente}`,sub:`${c.tipo} · ${c.indirizzo}`,date:c.data}))];
 return heading('Buongiorno 👋','Ecco una panoramica delle attività del negozio.')+
 `<div class="welcome"><div><h2>Benvenuto nel gestionale SERAFINO</h2><p>Un unico spazio per clienti, preventivi, ordini e consegne.<br>Puoi personalizzare i dati di esempio dalle singole sezioni.</p></div><div class="welcome-mark">⌂</div></div>`+
 `<div class="stats">
 <div class="stat"><div class="stat-top">Clienti registrati <span class="stat-icon">♙</span></div><div class="stat-value">${db.clienti.length}</div><div class="stat-note">Anagrafiche nel gestionale</div></div>
 <div class="stat"><div class="stat-top">Preventivi aperti <span class="stat-icon">▤</span></div><div class="stat-value">${db.preventivi.filter(p=>!['Accettato','Rifiutato'].includes(p.stato)).length}</div><div class="stat-note">Da seguire o confermare</div></div>
 <div class="stat"><div class="stat-top">Ordini attivi <span class="stat-icon">▣</span></div><div class="stat-value">${db.ordini.length}</div><div class="stat-note">Ordini registrati</div></div>
 <div class="stat"><div class="stat-top">Residuo ordini demo <span class="stat-icon">€</span></div><div class="stat-value" style="font-size:22px">${euro(Math.max(0,residuo))}</div><div class="stat-note">Stima da ordini meno pagamenti registrati</div></div></div>
 <div class="grid-two"><div>${panel('Ordini recenti','Stato degli ordini registrati',table(['ORDINE / CLIENTE','DATA','TOTALE','STATO'],rows),'goTo(\\'ordini\\')')}${panel('Attività da seguire','Promemoria generati dai dati attuali',`<div class="task-list">${tasks.length?tasks.map(t=>`<div class="task"><span class="task-mark"></span><div class="task-text">${escapeHtml(t.title)}<small>${escapeHtml(t.sub)}</small></div><span class="task-date">${escapeHtml(t.date||'')}</span></div>`).join(''):'<div class="empty">Nessuna attività in evidenza.</div>'}</div>`)}</div>
 <div>${panel('Ultimi preventivi','Offerte commerciali recenti',table(['PREVENTIVO / CLIENTE','TOTALE','STATO'],db.preventivi.slice(0,4).map(p=>`<tr><td>${rowPrimary(p.numero,p.cliente)}</td><td>${euro(p.totale)}</td><td>${pill(p.stato)}</td></tr>`).join('')),'goTo(\\'preventivi\\')')}${panel('Accesso rapido','Le operazioni più frequenti',`<div class="task-list"><div class="task"><span class="activity-icon">♙</span><div class="task-text">Aggiungi un cliente<small>Crea una nuova anagrafica</small></div><button class="btn btn-secondary" onclick="newRecord('clienti')">Apri</button></div><div class="task"><span class="activity-icon">▤</span><div class="task-text">Crea un preventivo<small>Prepara una nuova offerta</small></div><button class="btn btn-secondary" onclick="newRecord('preventivi')">Apri</button></div><div class="task"><span class="activity-icon">▣</span><div class="task-text">Registra un ordine<small>Segui una vendita</small></div><button class="btn btn-secondary" onclick="newRecord('ordini')">Apri</button></div></div>`)}</div></div>
 <div class="footer-note">Nota: i dati iniziali sono dimostrativi e vengono salvati solo in questo browser. Non usare ancora dati reali dei clienti.</div>`;
}
const configs={
 clienti:{fields:[['nome','Nome e cognome','text',true],['telefono','Telefono','tel'],['email','Email','email'],['indirizzo','Indirizzo','text'],['note','Note','textarea']],cols:[['Cliente','nome','indirizzo'],['Telefono','telefono'],['Email','email']]},
 prodotti:{fields:[['nome','Nome prodotto','text',true],['categoria','Categoria','select',['Cucine','Camere da letto','Camerette','Soggiorni','Divani e poltrone','Tavoli e sedie','Bagni','Armadi','Complementi d’arredo','Materassi','Altro']],['marca','Marca','text'],['prezzo','Prezzo di vendita (€)','number'],['fornitore','Fornitore','text'],['disponibilita','Disponibilità','select',['Disponibile','Su ordinazione','Da verificare','Fuori produzione']]],cols:[['Prodotto','nome','categoria'],['Marca','marca'],['Prezzo vendita','prezzo','money'],['Disponibilità','disponibilita','pill']]},
 preventivi:{fields:[['numero','Numero preventivo','text',true],['cliente','Cliente','text',true],['data','Data','date',true],['totale','Totale (€)','number',true],['stato','Stato','select',['In preparazione','Inviato','In attesa','Accettato','Rifiutato','Scaduto']],['note','Note e condizioni','textarea']],cols:[['Preventivo','numero','cliente'],['Data','data'],['Totale','totale','money'],['Stato','stato','pill']]},
 ordini:{fields:[['numero','Numero ordine','text',true],['cliente','Cliente','text',true],['data','Data ordine','date',true],['totale','Totale ordine (€)','number',true],['stato','Stato ordine','select',['Da confermare','Confermato','In attesa fornitore','In produzione','Merce ricevuta','Consegna da programmare','Consegnato','Completato','Annullato']],['consegna','Stato consegna','select',['Da programmare','Programmata','Consegnata','Da riprogrammare']],['note','Note','textarea']],cols:[['Ordine','numero','cliente'],['Data','data'],['Totale','totale','money'],['Stato','stato','pill']]},
 fornitori:{fields:[['nome','Ragione sociale / nome','text',true],['referente','Referente commerciale','text'],['telefono','Telefono','tel'],['email','Email','email'],['marchi','Marchi / categorie','text'],['note','Note','textarea']],cols:[['Fornitore','nome','referente'],['Telefono','telefono'],['Email','email'],['Marchi','marchi']]},
 pagamenti:{fields:[['ordine','Numero ordine','text',true],['cliente','Cliente','text',true],['data','Data pagamento','date',true],['importo','Importo (€)','number',true],['metodo','Metodo','select',['Bonifico','Carta','Contanti','Assegno','Finanziamento','Altro']],['note','Note / riferimento','text']],cols:[['Ordine','ordine','cliente'],['Data','data'],['Importo','importo','money'],['Metodo','metodo']]},
 consegne:{fields:[['cliente','Cliente','text',true],['ordine','Numero ordine','text',true],['data','Data consegna','date',true],['ora','Orario','time'],['indirizzo','Indirizzo consegna','text'],['tipo','Tipo intervento','select',['Consegna','Montaggio','Consegna e montaggio','Sopralluogo','Assistenza']],['stato','Stato','select',['Da confermare','Confermata','In corso','Completata','Da riprogrammare']],['note','Note operative','textarea']],cols:[['Cliente','cliente','ordine'],['Data','data'],['Orario','ora'],['Intervento','tipo'],['Stato','stato','pill']]},
 utenti:{fields:[['nome','Nome e cognome','text',true],['email','Email aziendale','email',true],['ruolo','Ruolo','select',['Proprietario','Amministrazione','Vendite','Consegne']],['stato','Stato','select',['Da attivare','Attivo','Disattivato']]],cols:[['Utente','nome','email'],['Ruolo','ruolo','pill'],['Stato','stato','pill']]}
};
function renderList(key){
 const cfg=configs[key], records=db[key]||[];
 const rows=records.map(r=>`<tr>${cfg.cols.map(c=>{let val=r[c[1]]||'—';if(c[2]==='money')val=euro(val);if(c[2]==='pill')val=pill(val);else if(c[2])val=`${escapeHtml(val)}${c[2]&&c[2]!=='money'&&c[2]!=='pill'?`<div class="sub-cell">${escapeHtml(r[c[2]]||'')}</div>`:''}`;return `<td>${val}</td>`}).join('')}<td><button class="text-button" onclick="editRecord('${key}',${r.id})">Modifica</button> <button class="text-button" style="color:#a95555" onclick="deleteRecord('${key}',${r.id})">Elimina</button></td></tr>`).join('');
 const heads=cfg.cols.map(c=>c[0]).concat(['AZIONI']);
 return heading(pages[key].title,pages[key].sub,pages[key].action)+
 `<div class="section-toolbar"><input class="filter" id="filterInput" placeholder="Cerca in ${pages[key].title.toLowerCase()}…" oninput="filterTable()"><select class="filter" id="sortFilter" onchange="filterTable()"><option value="">Tutti i record</option><option value="recent">Più recenti / ultimi inseriti</option></select><span style="margin-left:auto;color:var(--muted);font-size:11px">${records.length} record</span></div>`+
 `<section class="panel table-panel"><div class="panel-head"><div><h2>Archivio ${pages[key].title.toLowerCase()}</h2><p>Informazioni registrate nel gestionale</p></div><button class="btn btn-secondary" onclick="exportCsv('${key}')">↓ Esporta CSV</button></div><div id="tableHolder">${records.length?table(heads,rows):'<div class="empty">Nessun dato presente. Aggiungi il primo record con il pulsante in alto.</div>'}</div></section><div class="footer-note">Le modifiche di questa versione vengono salvate nel browser corrente, non sono ancora sincronizzate tra dispositivi.</div>`;
}
function renderStats(){
 const tot=db.ordini.reduce((s,x)=>s+Number(x.totale||0),0), paid=db.pagamenti.reduce((s,x)=>s+Number(x.importo||0),0);
 const cat={};db.prodotti.forEach(p=>cat[p.categoria||'Altro']=(cat[p.categoria||'Altro']||0)+1);
 return heading(pages.statistiche.title,pages.statistiche.sub)+`<div class="stats"><div class="stat"><div class="stat-top">Valore ordini registrati <span class="stat-icon">€</span></div><div class="stat-value" style="font-size:23px">${euro(tot)}</div><div class="stat-note">Valore degli ordini inseriti, non fatturato fiscale</div></div><div class="stat"><div class="stat-top">Pagamenti registrati <span class="stat-icon">↙</span></div><div class="stat-value" style="font-size:23px">${euro(paid)}</div><div class="stat-note">Movimenti inseriti nel gestionale</div></div><div class="stat"><div class="stat-top">Clienti <span class="stat-icon">♙</span></div><div class="stat-value">${db.clienti.length}</div><div class="stat-note">Anagrafiche totali</div></div><div class="stat"><div class="stat-top">Prodotti <span class="stat-icon">▦</span></div><div class="stat-value">${db.prodotti.length}</div><div class="stat-note">Articoli in catalogo</div></div></div><div class="grid-two">${panel('Prodotti per categoria','Distribuzione del catalogo',`<div class="task-list">${Object.entries(cat).map(([k,v])=>`<div class="task"><div class="task-text">${escapeHtml(k)}</div><span class="pill">${v} prodotti</span></div>`).join('')||'<div class="empty">Nessun prodotto</div>'}</div>`)}${panel('Indicatori da completare','Dati che richiederanno una configurazione più approfondita',`<div class="task-list"><div class="task"><span class="task-mark"></span><div class="task-text">Margine commerciale<small>Richiede costi d’acquisto e costi accessori affidabili</small></div></div><div class="task"><span class="task-mark"></span><div class="task-text">Andamento mensile<small>Richiede date e stati degli ordini verificati</small></div></div><div class="task"><span class="task-mark"></span><div class="task-text">Scadenze fornitori<small>Da implementare con gli ordini di acquisto</small></div></div></div>`)}</div><div class="notice"><strong>Nota:</strong> i dati iniziali sono di esempio. Gli indicatori non sostituiscono contabilità, fatturazione elettronica o bilancio aziendale.</div>`;
}
function renderSettings(){
 return heading(pages.utenti.title,pages.utenti.sub,'Aggiungi utente')+
 `<div class="notice"><strong>Importante:</strong> questa versione è un prototipo locale. Gli account elencati non hanno ancora credenziali reali e non costituiscono un sistema di autenticazione. Prima di utilizzarlo con dati aziendali, servirà configurare accessi individuali e database online sicuro.</div>`+
 `<div class="grid-two">${panel('Utenti registrati','Elenco dimostrativo',renderListInner('utenti'))}${panel('Configurazione aziendale','Dati da personalizzare',`<div class="form-grid"><div class="field full"><label>Nome attività</label><input value="Arredamenti Serafino" readonly></div><div class="field full"><label>Payoff</label><input value="Sogna. Arreda. Vivi." readonly></div><div class="field full"><label>Logo</label><div style="padding:15px;background:#fafafa;border:1px solid var(--line);border-radius:8px"><img src="assets/logo-serafino.png" style="max-width:220px;max-height:85px;object-fit:contain" alt="Logo Serafino"></div></div></div>`)}</div>`;
}
function renderListInner(key){let cfg=configs[key],records=db[key]||[];return records.length?table(cfg.cols.map(c=>c[0]),records.map(r=>`<tr>${cfg.cols.map(c=>`<td>${c[2]==='pill'?pill(r[c[1]]):escapeHtml(r[c[1]]||'—')}${c[2]&&c[2]!=='pill'&&c[2]!=='money'?`<div class="sub-cell">${escapeHtml(r[c[2]]||'')}</div>`:''}</td>`).join('')}</tr>`).join('')):'<div class="empty">Nessun utente registrato.</div>'}
function render(){
 document.getElementById('breadcrumb').textContent=pages[current].title;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));
 let html=current==='dashboard'?dashboard():current==='statistiche'?renderStats():current==='utenti'?renderSettings():renderList(current);
 document.getElementById('content').innerHTML=html;
 document.getElementById('sidebar').classList.remove('open');
}
function goTo(key){current=key;render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.page)));
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase().trim();if(!q)return;const match=['clienti','prodotti','preventivi','ordini','fornitori','pagamenti','consegne'].find(k=>(db[k]||[]).some(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q))));if(match){goTo(match);setTimeout(()=>{let f=document.getElementById('filterInput');if(f){f.value=q;filterTable()}},0)}else toast('Nessun risultato trovato nei dati correnti.')}})
function filterTable(){const q=(document.getElementById('filterInput')?.value||'').toLowerCase();document.querySelectorAll('#tableHolder tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>root.innerHTML='',2800)}
function newRecord(key){openForm(key,null)}
function editRecord(key,id){openForm(key,id)}
function deleteRecord(key,id){if(!confirm('Vuoi eliminare questo record? L’operazione non può essere annullata.'))return;db[key]=db[key].filter(r=>r.id!==id);save();render();toast('Record eliminato.')}
function openForm(key,id){
 const cfg=configs[key];if(!cfg){toast('Questa funzione sarà disponibile in una prossima versione.');return}
 const existing=id?(db[key]||[]).find(r=>r.id===id):null;
 const formFields=cfg.fields.map(f=>{const [name,label,type,extra]=f;let val=existing?.[name]??(type==='date'?new Date().toISOString().slice(0,10):'');let input='';
 if(type==='select')input=`<select name="${name}">${extra.map(o=>`<option ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`;
 else if(type==='textarea')input=`<textarea name="${name}">${escapeHtml(val)}</textarea>`;
 else input=`<input name="${name}" type="${type}" value="${escapeHtml(val)}" ${extra===true?'required':''} ${type==='number'?'min="0" step="0.01"':''}>`;
 return `<div class="field ${type==='textarea'?'full':''}"><label>${label}${extra===true?' *':''}</label>${input}</div>`}).join('');
 document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-title"><h2>${existing?'Modifica':'Nuovo'} · ${pages[key].title.replace(/s$/,'')}</h2><button class="close" onclick="closeModal()">×</button></div><form id="recordForm"><div class="form-grid">${formFields}</div><div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button><button class="btn btn-primary" type="submit">Salva record</button></div></form></div></div>`;
 document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());if(data.totale!==undefined)data.totale=Number(data.totale||0);if(data.importo!==undefined)data.importo=Number(data.importo||0);if(existing){Object.assign(existing,data)}else{data.id=Math.max(0,...(db[key]||[]).map(r=>Number(r.id)||0))+1;db[key].push(data)}save();closeModal();render();toast(existing?'Modifiche salvate.':'Record aggiunto.');});
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function exportCsv(key){const rows=db[key]||[];if(!rows.length){toast('Nessun record da esportare.');return}const cols=Object.keys(rows[0]);const csv=[cols.join(';'),...rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(';'))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`serafino-${key}.csv`;a.click();URL.revokeObjectURL(a.href);toast('Esportazione CSV avviata.')}
render();
</script>
</body>
</html>
